{% extends "blog/base.html" %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
    <div class="danger-box">
        <h2>⚠ Удаление поста</h2>
        <p class="danger-text">
            Внимание! Это действие нельзя отменить. Пост будет удалён навсегда.
        </p>
    </div>

    <h3>"{{ post.title }}"</h3>
    <p>{{ post.body|truncatechars:200 }}</p>

    <form method="post" class="delete-form">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'post_detail' pk=post.pk %}" class="btn-cancel">Отмена</a>
    </form>
{% endblock %}
