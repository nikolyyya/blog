{% extends "blog/base.html" %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
  <section class="card editor-card mx-auto shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h2 mb-3">Удаление поста</h1>
      <p>Вы собираетесь удалить пост «{{ post.title }}».</p>
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Удалить</button>
        {% if post.is_published %}
          <a class="btn btn-outline-secondary" href="{% url 'post_detail' pk=post.pk %}">Отмена</a>
        {% else %}
          <a class="btn btn-outline-secondary" href="{% url 'post_list' %}">Отмена</a>
        {% endif %}
      </form>
    </div>
  </section>
{% endblock %}
