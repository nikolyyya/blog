{% extends "blog/base.html" %}

{% block title %}Редактирование поста{% endblock %}

{% block content %}
  <section class="card editor-card mx-auto shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h2 mb-4">Редактирование поста</h1>
      <form method="post">
        {% csrf_token %}
        {% include "blog/_form_fields.html" %}
        <button class="btn btn-primary" type="submit">Сохранить</button>
        {% if post.is_published %}
          <a class="btn btn-outline-secondary" href="{{ post.get_absolute_url }}">Отмена</a>
        {% else %}
          <a class="btn btn-outline-secondary" href="{% url 'blog:post_list' %}">Отмена</a>
        {% endif %}
      </form>
    </div>
  </section>
{% endblock %}
