{% extends "blog/base.html" %}

{% block title %}Новый пост{% endblock %}

{% block content %}
  <section class="card editor-card mx-auto shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h2 mb-4">Новый пост</h1>
      <form method="post">
        {% csrf_token %}
        {% include "blog/_form_fields.html" %}
        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-primary" type="submit">Опубликовать</button>
          <a class="btn btn-outline-secondary" href="{% url 'post_list' %}">Отмена</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
