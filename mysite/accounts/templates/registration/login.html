{% extends "blog/base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <section class="card account-card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h1 class="h2 mb-4">Вход</h1>
          <form method="post">
            {% csrf_token %}
            {% include "blog/_form_fields.html" %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <button class="btn btn-primary" type="submit">Войти</button>
          </form>
          <p class="mt-3 mb-1">Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрируйтесь</a>.</p>
          <p class="mb-0"><a href="{% url 'password_reset' %}">Забыли пароль?</a></p>
        </div>
      </section>
    </div>
  </div>
{% endblock %}
